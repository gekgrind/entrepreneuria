# /etc/nginx/conf.d/00-entrepreneuria-http.conf  (http context; Ubuntu 24.04 nginx 1.24)
# Remove /etc/nginx/sites-enabled/default first: it also claims default_server on :80.

# WebSocket / HTTP upgrade support for the app proxies.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

# Requests for any host we do not serve are dropped, on both address families.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# TLS for unknown hosts: refuse the handshake (no certificate needed; nginx >= 1.19.4).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

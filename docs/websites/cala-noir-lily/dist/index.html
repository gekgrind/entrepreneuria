<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CALA NOIR — Typographic Calla Lily</title>
<meta name="description" content="A calla lily drawn entirely from the letters of CALA NOIR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* CALA NOIR hero — one dark stage; the flower holds the right, the words hold the lower left. */
:root {
  color-scheme: dark;
  --noir: #0b0a09;
  --noir-lift: #15130f;
  --ivory: #efe9db;
  --ivory-soft: rgba(239, 233, 219, 0.60);
  --ivory-faint: rgba(239, 233, 219, 0.16);
  --sage: #8b9c74;
  --saffron: #d6a84e;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--noir); color: var(--ivory); font-family: var(--mono); -webkit-font-smoothing: antialiased; }

.cn {
  position: relative; isolation: isolate; overflow: hidden;
  height: 100%; min-height: 600px;
  display: grid; grid-template-rows: auto 1fr auto;
  padding-block: clamp(18px, 3vh, 34px);
  padding-left: max(clamp(16px, 4vw, 56px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 4vw, 56px), env(safe-area-inset-right, 0px));
  background:
    radial-gradient(60% 70% at 64% 40%, rgba(139, 156, 116, 0.085), transparent 70%),
    radial-gradient(120% 90% at 50% 110%, var(--noir-lift), transparent 60%),
    var(--noir);
}
/* canvas host: fills the hero; the flower is placed with custom properties */
.cn-stage { position: absolute; inset: 0; z-index: -1; --lily-x: 0.79; --lily-y: 0.60; --lily-fit: 0.95; --lily-width: 3; }

.cn-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
.cn-mark { font-family: var(--display); font-size: clamp(17px, 1.5vw, 21px); letter-spacing: 0.42em; color: var(--ivory); text-decoration: none; white-space: nowrap; }
.cn-nav { display: flex; gap: clamp(16px, 2.4vw, 36px); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
.cn-nav a { color: var(--ivory-soft); text-decoration: none; transition: color 0.25s; }
.cn-nav a:hover, .cn-nav a:focus-visible { color: var(--ivory); }

.cn-copy { align-self: end; max-width: 30rem; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 24px); padding-bottom: clamp(20px, 5vh, 56px); }
.cn-eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--sage); }
.cn-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(46px, 7.4vw, 112px); line-height: 0.94; letter-spacing: -0.015em; text-wrap: balance; }
.cn-title em { font-style: italic; }
.cn-lede { margin: 0; max-width: 24rem; font-size: 13px; line-height: 1.75; color: var(--ivory-soft); }
.cn-cta {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 14px;
  padding: 15px 22px; border: 1px solid var(--ivory-faint); color: var(--ivory); text-decoration: none;
  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
  transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}
.cn-cta::after { content: ""; width: 22px; height: 1px; background: currentColor; transition: width 0.3s; }
.cn-cta:hover, .cn-cta:focus-visible { background: var(--ivory); color: var(--noir); border-color: var(--ivory); }
.cn-cta:hover::after { width: 34px; }

.cn-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ivory-soft); }
.cn-fig { margin: 0; }
.cn-fig b { font-weight: 500; color: var(--saffron); font-variant-numeric: tabular-nums; }
.cn-replay { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--ivory-faint); padding: 4px 0; cursor: pointer; transition: color 0.25s, border-color 0.25s; }
.cn-replay:hover, .cn-replay:focus-visible { color: var(--ivory); border-color: var(--ivory); }
.cn a:focus-visible, .cn button:focus-visible { outline: 1px solid var(--ivory); outline-offset: 4px; }

@media (max-width: 820px) {
  .cn { min-height: 620px; }
  .cn-stage { --lily-x: 0.47; --lily-top: 92px; --lily-fit: 0.78; --lily-width: 0.80;
    /* let the stem dissolve before it reaches the copy */
    -webkit-mask-image: linear-gradient(to bottom, #000 49%, transparent 61%); mask-image: linear-gradient(to bottom, #000 49%, transparent 61%); }
  .cn-nav a:not(.cn-nav-keep) { display: none; }
  .cn-copy { padding-bottom: 18px; gap: 12px; }
  .cn-title { font-size: clamp(44px, 13vw, 64px); }
  .cn-lede { font-size: 12px; line-height: 1.65; }
  .cn-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cn-replay { display: none; }
  .cn-nav a, .cn-cta, .cn-cta::after, .cn-replay { transition: none; }
}
</style>
</head>
<body>
<main class="cn">
  <div class="cn-stage" data-cala-lily></div>

  <header class="cn-bar">
    <a class="cn-mark" href="#top">CALA NOIR</a>
    <nav class="cn-nav" aria-label="Primary">
      <a href="#atelier">Atelier</a>
      <a href="#services">Services</a>
      <a href="#journal">Journal</a>
      <a class="cn-nav-keep" href="#reserve">Reserve</a>
    </nav>
  </header>

  <section class="cn-copy">
    <p class="cn-eyebrow">Avant-garde hair atelier</p>
    <h1 class="cn-title">Cut from <em>shadow.</em></h1>
    <p class="cn-lede">Precision cutting and colour, composed one guest at a time. By appointment only.</p>
    <a class="cn-cta" href="#reserve">Reserve a chair</a>
  </section>

  <footer class="cn-foot">
    <p class="cn-fig">Fig. 01 — Zantedeschia, set in <b data-lily-count>2,600</b> letters</p>
    <button class="cn-replay" type="button" id="cn-replay">Replay the bloom</button>
  </footer>
</main>

<script>
(function () {
/**
 * CALA NOIR — typographic calla lily
 *
 * A calla lily modelled as a parametric surface and drawn entirely with the
 * letters C·A·L·A·N·O·I·R on a 2D canvas. No dependencies.
 *
 *   var lily = mountCalaLily(hostElement, { word: 'CALANOIR' });
 *   lily.destroy();   // remove listeners, observers and the canvas
 *   lily.replay();    // run the assembly again
 *
 * The canvas fills `host`. Placement is controlled from CSS on the host:
 *   --lily-x: 0.5;   horizontal centre of the flower, as a fraction of host width
 *   --lily-y: 0.5;   vertical centre, as a fraction of host height
 *   --lily-fit: 0.9; flower height as a fraction of host height
 *   --lily-width: 0.92; widest the flower may be, as a fraction of host width (above 1 lets it crop)
 *   --lily-top: 84px; optional: pin the top of the bloom this far from the host's top instead of using --lily-y
 */
function mountCalaLily(host, options) {
  'use strict';
  var o = options || {};
  var doc = host.ownerDocument || document;
  var win = doc.defaultView || window;

  var WORD = String(o.word || 'CALANOIR').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'CALANOIR';
  var FONT = o.font || '"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace';
  var WEIGHT = o.weight || 500;
  var LIP_FONT = o.lipFont || '"Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif';
  var LIP_WEIGHT = o.lipWeight || 600;
  var LIP_ON = o.lip === true;              // display-serif lettering on the lip (off by default)
  var LIP_SCALE = o.lipScale || 2.9;        // lip lettering size, as a multiple of the body glyph
  var GLYPH_PX = o.glyphSize || 0;          // 0 = automatic
  var INTERACTIVE = o.interactive !== false;

  var PI = Math.PI;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function sstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // smooth, repeatable noise: decides where letters keep to the line and where they loosen
  function hash2(i, j) {
    var h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }

  // ───────────────────────── letters ─────────────────────────
  var UNIQUE = [];
  var WORD_IDX = [];
  for (var wi = 0; wi < WORD.length; wi++) {
    var u = UNIQUE.indexOf(WORD[wi]);
    if (u < 0) { u = UNIQUE.length; UNIQUE.push(WORD[wi]); }
    WORD_IDX.push(u);
  }
  var WLEN = WORD.length;

  // ───────────────────────── palette ─────────────────────────
  // rows of the glyph atlas. 0-5 spathe (throat green → ivory), 6 lip,
  // 7-8 spadix (saffron), 9-10 stem (sage).
  var THROAT = o.throat || [158, 170, 124];
  var IVORY = o.ivory || [240, 233, 219];
  var COLORS = [];
  for (var ci = 0; ci < 6; ci++) {
    var cm = ci / 5;
    COLORS.push('rgb(' + Math.round(THROAT[0] + (IVORY[0] - THROAT[0]) * cm) + ',' +
      Math.round(THROAT[1] + (IVORY[1] - THROAT[1]) * cm) + ',' +
      Math.round(THROAT[2] + (IVORY[2] - THROAT[2]) * cm) + ')');
  }
  COLORS.push(o.lip || '#fbf6ea');
  COLORS.push(o.spadix || '#d6a84e', o.spadixDeep || '#b98a3c');
  COLORS.push(o.stem || '#7f9169', o.stemDeep || '#5f7453');

  // ───────────────────────── geometry ─────────────────────────
  // Object units, y up, bloom base at the origin. theta = 0 is the back of the
  // spathe (where the tip rises); theta = ±PI is the front seam where the
  // margins overlap.
  var G = {
    r0: 0.052,        // radius where stem meets spathe
    Lmin: 0.80,       // meridian length at the front lip
    Lmax: 2.30,       // meridian length at the tip
    tipPow: 1.75,      // how sharply the rim climbs to the tip
    overlap: 0.17,    // how far the margins wrap past each other (× PI)
    spiral: 0.24,     // radial offset that separates the wrapped margins
    stemLen: 1.85,
    stemR: 0.040,
    stemCurve: -0.42, // sideways drift of the stem toward its foot
    spadixBase: 0.26,
    spadixLen: 0.66,
    spadixR: 0.043
  };
  var TH_MAX = PI * (1 + G.overlap);
  var PIVOT_Y = -0.35, STEM_SHOWN = 0.80;

  function rimLen(a) {                       // a = |theta| / PI
    var b = a > 1 ? 1 : a;
    var L = G.Lmin + (G.Lmax - G.Lmin) * Math.pow(1 - b, G.tipPow);
    if (a > 1) L -= 0.20 * (a - 1) / G.overlap;
    return L + 0.22 * Math.exp(-(a * a) / 0.0042);   // drawn-out point at the tip
  }
  // angle of the meridian from vertical at arc length t
  function phi(t, L, open) {
    var tube = 0.05;
    var cone = 0.22 * sstep(0.04, 0.40, t) + 0.21 * sstep(0.50, 1.20, t);
    var curl = 1.25 * Math.pow(sstep(1.25, 2.40, t), 1.7);
    var roll = 1.15 * sstep(L - 0.24, L, t) * sstep(0.3, 0.9, L);
    return tube + open * (cone + curl + roll) + (1 - open) * 0.07 * sstep(0.3, 1.5, t);
  }
  var _s = [0, 0, 0];
  function surf(theta, t, open, out) {
    var L = rimLen(Math.abs(theta) / PI);
    var n = 22, h = t / n, r = G.r0, y = 0;
    for (var i = 0; i < n; i++) {
      var ph = phi((i + 0.5) * h, L, open);
      r += Math.sin(ph) * h; y += Math.cos(ph) * h;
    }
    var closed = 1 - open;
    r *= 1 + G.spiral * (theta / PI) * (1 + closed * 1.1);
    r *= 1 + 0.05 * Math.sin(theta * 3 + 0.8) * sstep(0.5, 1.5, t) * open;   // the petal is never a perfect cone
    // the tip twists and leans to one side: a calla is never symmetric
    var th = theta * (1 + closed * 0.2) + 0.42 * sstep(0.9, G.Lmax, t) * open;
    var lean = sstep(0.7, G.Lmax, t);
    out[0] = r * Math.sin(th) + 0.11 * lean * lean * open; out[1] = y; out[2] = -r * Math.cos(th);
    return out;
  }
  function stemX(v) { return G.stemCurve * v * v + 0.085 * Math.sin(v * 3.3) * (0.3 + v); }
  // lip lettering tapers into the tip and toward the wrapped seam
  function lipK(a) { return (0.46 + 0.54 * sstep(0.015, 0.26, a)) * (1 - 0.4 * sstep(0.9, 1 + G.overlap, a)); }

  // rest pose
  var YAW0 = o.yaw != null ? o.yaw : -0.60, PITCH0 = o.pitch != null ? o.pitch : 0.25, ROLL0 = o.roll != null ? o.roll : -0.18;
  function restRow(row) {
    var cy = Math.cos(YAW0), sy = Math.sin(YAW0), cp = Math.cos(PITCH0), sp = Math.sin(PITCH0);
    var cr = Math.cos(ROLL0), sr = Math.sin(ROLL0);
    return row === 0 ? [cr * cy - sr * sp * sy, -sr * cp, cr * sy + sr * sp * cy]
      : [sr * cy + cr * sp * sy, cr * cp, sr * sy - cr * sp * cy];
  }
  // bounding box of the flower in its rest pose (object units, screen axes)
  var BOX = { x0: 0, x1: 0, y0: 0, y1: 0 };
  function measure() {
    var rx = restRow(0), ry = restRow(1), p = [0, 0, 0];
    var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    function take(X, Y, Z) {
      Y -= PIVOT_Y;
      var sx = rx[0] * X + rx[1] * Y + rx[2] * Z, sy = ry[0] * X + ry[1] * Y + ry[2] * Z;
      if (sx < x0) x0 = sx; if (sx > x1) x1 = sx; if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
    }
    for (var th = -TH_MAX; th <= TH_MAX; th += 0.08) {
      var L = rimLen(Math.abs(th) / PI);
      for (var k = 1; k <= 8; k++) { surf(th, L * k / 8, 1, p); take(p[0], p[1], p[2]); }
    }
    take(stemX(STEM_SHOWN), -G.stemLen * STEM_SHOWN, 0);
    BOX.x0 = x0; BOX.x1 = x1; BOX.y0 = y0; BOX.y1 = y1;
  }

  // ───────────────────────── particles ─────────────────────────
  var N = 0;
  var P = null;      // struct of typed arrays
  var KIND_SPATHE = 0, KIND_LIP = 1, KIND_SPADIX = 2, KIND_STEM = 3;
  var RIM = { n: 0 };  // samples along the rim that carry the lip lettering

  function build(em, lipU) {
    var rnd = mulberry(20241);
    var list = [];
    var a = [0, 0, 0], b = [0, 0, 0], c = [0, 0, 0], d = [0, 0, 0];
    var rx = restRow(0);
    // the name should read left-to-right wherever the surface faces the viewer,
    // so the letter order follows the on-screen direction of each ring
    function order(count) { return WORD_IDX[((count % WLEN) + WLEN) % WLEN]; }
    function dirAt(theta, t) {
      surf(theta, t, 1, a); surf(theta + 0.004, t, 1, c);
      return rx[0] * (c[0] - a[0]) + rx[1] * (c[1] - a[1]) + rx[2] * (c[2] - a[2]) >= 0 ? 1 : -1;
    }
    em = Math.max(em, 0.012);
    var ringStep = em * 0.92, letterStep = em * 0.64;
    if (!LIP_ON) lipU = 0;
    function lift(it, d) {      // float a letter off the surface, along its normal
      it.x += it.nx * d; it.y += it.ny * d; it.z += it.nz * d; it.bx += it.nx * d; it.by += it.ny * d; it.bz += it.nz * d;
    }

    function add(kind, theta, t, col, ch, sizeK, delay, tN) {
      surf(theta, t, 1, a);
      surf(theta, t, 0, b);
      var e = 0.004;
      surf(theta + e, t, 1, c);
      surf(theta, t + e, 1, d);
      var ux = c[0] - a[0], uy = c[1] - a[1], uz = c[2] - a[2];
      var vx = d[0] - a[0], vy = d[1] - a[1], vz = d[2] - a[2];
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      var nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      var ul = Math.sqrt(ux * ux + uy * uy + uz * uz) || 1;
      // (dP/dtheta × dP/dt) points inward for this parametrisation: flip to outward
      list.push({
        tx: ux / ul, ty: uy / ul, tz: uz / ul,
        k: kind, x: a[0], y: a[1], z: a[2], bx: b[0], by: b[1], bz: b[2],
        nx: -nx / nl, ny: -ny / nl, nz: -nz / nl, col: col, ch: ch, sizeK: sizeK,
        delay: delay, tN: tN, swirl: (1.9 + rnd() * 1.5) * (rnd() < 0.5 ? 1 : 0.8), spread: 1.3 + rnd() * 2.2,
        seed: rnd()
      });
    }

    // spathe: letters follow rings of the petal, but a seeded noise field decides where
    // they keep to the line and where they loosen, cluster, swell or thin out
    var ring = 0;
    for (var t = ringStep * 0.6; t < G.Lmax - ringStep * 0.3; t += ringStep) {
      ring++;
      var count = (ring * 3) % WLEN;
      var theta = -TH_MAX + (ring % 2) * 0.02;
      while (theta < TH_MAX) {
        var L = rimLen(Math.abs(theta) / PI);
        surf(theta, Math.min(t, L), 1, a);
        var rad = Math.max(0.03, Math.sqrt(a[0] * a[0] + a[2] * a[2]));
        var stepK = 1;
        if (t < L - Math.max(lipU * 0.92 * lipK(Math.abs(theta) / PI), ringStep * 0.5)) {
          var tl = t / L;
          var ca = sstep(0.34, 0.72, vnoise(theta * 1.25 + 7.3, t * 2.1));     // 0 keeps the line, 1 lets go
          var dn = vnoise(theta * 2.3 - 3.1, t * 3.3 + 11.7);                    // clusters and clearings
          var keep = 0.34 + 0.62 * dn + 0.30 * sstep(0.70, 1, tl) - 0.22 * (1 - sstep(0.12, 0.5, tl));
          count++;
          if (rnd() < keep) {
            var tj = clamp(t + (rnd() - 0.5) * ringStep * (0.2 + 1.7 * ca), 0.03, L - 0.012);
            var thj = theta + (rnd() - 0.5) * (letterStep / rad) * (0.15 + 1.5 * ca);
            var u1 = rnd(), m = u1 < 0.80 ? 0.72 + 0.5 * rnd() : u1 < 0.965 ? 1.3 + 0.5 * rnd() : 1.75 + 0.7 * rnd();
            m = 1 + (m - 1) * (0.3 + 0.7 * ca);
            var ord = order((count - 1) * dirAt(theta, t));
            add(KIND_SPATHE, thj, tj, Math.round(sstep(0.0, 0.46, tj) * 5), ord, (0.62 + 0.6 * tl) * m,
              0.45 + (t / G.Lmax) * 1.2 + rnd() * 0.3, tj / L);
            var it0 = list[list.length - 1];
            it0.fo = 1 - 0.8 * ca; it0.tilt = (rnd() - 0.5) * 1.5 * ca; it0.ak = (0.62 + 0.5 * rnd()) * (m > 1.5 ? 0.66 : 1);
            if (ca > 0.55 && rnd() < 0.22) lift(it0, (rnd() - 0.25) * 0.13);
          }
          stepK = 1.25 - 0.5 * dn;
        }
        theta += (letterStep / rad) * stepK;
      }
    }

    // the lip: small letters set along the rim at uneven intervals, and a few that fray past it
    if (!LIP_ON) {
      var acc = 0, prevP = null, lcount = 0;
      for (var th3 = -TH_MAX; th3 <= TH_MAX; th3 += 0.004) {
        var L3 = rimLen(Math.abs(th3) / PI) - 0.012;
        surf(th3, L3, 1, a);
        if (prevP) acc += Math.sqrt((a[0] - prevP[0]) * (a[0] - prevP[0]) + (a[1] - prevP[1]) * (a[1] - prevP[1]) + (a[2] - prevP[2]) * (a[2] - prevP[2]));
        prevP = [a[0], a[1], a[2]];
        if (acc >= letterStep * (0.78 + 0.95 * vnoise(th3 * 3.1 + 5, 2.7))) {
          acc = 0; lcount++;
          var lo = order(lcount * dirAt(th3, L3));
          add(KIND_LIP, th3, L3 - rnd() * 0.02, 6, lo, 0.95 + 0.55 * rnd() * rnd(), 0.45 + (L3 / G.Lmax) * 1.2 + 0.3, 1);
          var it1 = list[list.length - 1]; it1.fo = 1; it1.tilt = (rnd() - 0.5) * 0.25; it1.ak = 0.8 + 0.3 * rnd();

    measure();
    layout();
    if (reduced) drawStill(); else start();
    if (typeof o.onReady === 'function') o.onReady({ letters: N, reducedMotion: reduced });
  }
  var booted = false;
  function bootOnce() { if (!booted) { booted = true; boot(); } }
  // wait briefly for the display font so the atlas is drawn with it; never block on it
  var fontTimer = win.setTimeout(bootOnce, 900);
  if (doc.fonts && doc.fonts.load) {
    win.Promise.all([doc.fonts.load(WEIGHT + ' 16px ' + FONT, WORD), LIP_ON ? doc.fonts.load(LIP_WEIGHT + ' 16px ' + LIP_FONT, WORD) : null]).then(function () {
      win.clearTimeout(fontTimer);
      if (booted && !destroyed) { makeAtlas(); if (reduced) drawStill(); }
      bootOnce();
    }, bootOnce);
  } else { win.clearTimeout(fontTimer); bootOnce(); }

  return {
    canvas: canvas,
    replay: function () { if (reduced) return; tStart = 0; nextAutoRipple = 5.5; nextMote = 6; MOTES.length = 0; ripples.length = 0; yaw = YAW0; pitch = PITCH0; start(); },
    ripple: function (x, y, amp) { addRipple(x, y, amp == null ? 1 : amp); },
    destroy: function () {
      destroyed = true; stop();
      win.clearTimeout(resizeTimer); win.clearTimeout(fontTimer);
      win.removeEventListener('pointermove', onPointerMove);
      win.removeEventListener('pointerdown', onPointerDown);
      win.removeEventListener('touchmove', onTouchMove);
      win.removeEventListener('scroll', onScroll);
      win.removeEventListener('resize', onResize);
      if (ro) ro.disconnect();
      if (io) io.disconnect();
      if (mqReduce) {
        if (mqReduce.removeEventListener) mqReduce.removeEventListener('change', onMotionPref);
        else if (mqReduce.removeListener) mqReduce.removeListener(onMotionPref);
      }
      if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    },
    // inspection hooks used by the test harness
    _debug: {
      stats: function () { return { particles: N, drawn: drawn, lip: lipDrawn, motes: MOTES.length, renderMs: renderMs, maxOffsetPx: Math.sqrt(maxOff), yaw: yaw, tier: tier, dpr: DPR, glyph: glyph, frameMs: frameEMA, scale: scale, reduced: reduced, running: running, T: T, autoMix: autoMix }; },
      seek: function (t) { seekT = t; },
      pose: function (y, p) { YAW0 = y; PITCH0 = p; yaw = y; pitch = p; measure(); builtEm = 0; layout(); },
      still: function () { stop(); drawStill(); }
    }
  };
}

  var lily = mountCalaLily(document.querySelector('[data-cala-lily]'), {
    onReady: function (info) {
      var el = document.querySelector('[data-lily-count]');
      if (el) el.textContent = info.letters.toLocaleString('en-US');
    }
  });
  window.calaLily = lily;
  var replay = document.getElementById('cn-replay');
  if (replay) replay.addEventListener('click', function () { lily.replay(); });
})();
</script>
</body>
</html>
